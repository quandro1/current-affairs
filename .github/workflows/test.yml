name: tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'config/**', 'package*.json']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/validate-config.js
      - run: npm test
        env:
          QUIET: '1'
